<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a1a;
      --surface: #242424;
      --surface2: #2e2e2e;
      --border: #3a3a3a;
      --text: #f0f0f0;
      --text-muted: #999;
      --accent: #FF6B35;
      --accent-hover: #ff8555;
      --danger: #e05252;
      --sidebar-w: 200px;
      --panel-w: 260px;
      --topbar-h: 52px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOP BAR */
    #topbar {
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    #topbar h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      margin-right: auto;
      letter-spacing: 0.5px;
    }
    .btn {
      padding: 7px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-ghost {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--border); }
    .btn-accent {
      background: var(--accent);
      color: #fff;
    }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    /* LAYOUT */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* SIDEBAR */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    #sidebar-header {
      padding: 10px 10px 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #sidebar-header span {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }
    #add-slide-btn {
      width: 26px; height: 26px;
      border-radius: 5px;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    #add-slide-btn:hover { background: var(--accent-hover); }

    #slides-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #slides-list::-webkit-scrollbar { width: 5px; }
    #slides-list::-webkit-scrollbar-track { background: transparent; }
    #slides-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .slide-thumb {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s;
      background: #fff;
      flex-shrink: 0;
    }
    .slide-thumb.active { border-color: var(--accent); }
    .slide-thumb:hover:not(.active) { border-color: var(--border); }
    .slide-thumb.drag-over { border-color: #4ea8f7; border-style: dashed; }

    .thumb-inner {
      width: 172px;
      height: 97px;
      overflow: hidden;
      position: relative;
      pointer-events: none;
    }
    .thumb-frame {
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      transform: scale(0.0896);
      position: absolute;
      top: 0; left: 0;
      overflow: hidden;
    }

    .thumb-index {
      position: absolute;
      bottom: 3px; left: 5px;
      font-size: 9px;
      color: rgba(0,0,0,0.5);
      font-weight: 700;
      pointer-events: none;
    }
    .thumb-delete {
      position: absolute;
      top: 3px; right: 3px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: rgba(220,80,80,0.85);
      border: none;
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      display: none;
      align-items: center; justify-content: center;
      line-height: 1;
    }
    .slide-thumb:hover .thumb-delete { display: flex; }

    /* MAIN AREA */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      overflow: hidden;
      padding: 24px;
      gap: 16px;
    }
    #slide-counter {
      font-size: 12px;
      color: var(--text-muted);
    }
    #preview-wrapper {
      position: relative;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
    }
    #preview-iframe {
      display: block;
      border: none;
    }

    /* RIGHT PANEL */
    #panel {
      width: var(--panel-w);
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
      padding: 0;
    }
    #panel::-webkit-scrollbar { width: 5px; }
    #panel::-webkit-scrollbar-track { background: transparent; }
    #panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .panel-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .panel-section h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }
    .control-row:last-child { margin-bottom: 0; }
    .control-row label {
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    input[type="color"] {
      width: 40px; height: 28px;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px;
      background: var(--surface2);
      cursor: pointer;
    }

    .number-input {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .number-input button {
      width: 24px; height: 26px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .number-input button:hover { background: var(--border); }
    .number-input input {
      width: 48px; height: 26px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      text-align: center;
      font-size: 13px;
    }
    .number-input input:focus { outline: 1px solid var(--accent); }

    #selected-info {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-style: italic;
    }

    .img-upload-area {
      width: 100%;
      height: 80px;
      border: 2px dashed var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      gap: 4px;
      transition: border-color 0.15s, background 0.15s;
      font-size: 12px;
      color: var(--text-muted);
    }
    .img-upload-area:hover {
      border-color: var(--accent);
      background: rgba(255,107,53,0.05);
      color: var(--accent);
    }
    .img-upload-area svg { opacity: 0.6; }

    #img-preview-panel {
      margin-top: 10px;
      display: none;
      gap: 6px;
      flex-direction: column;
    }
    #img-preview-panel.visible { display: flex; }
    #img-preview-thumb {
      width: 100%;
      height: 80px;
      object-fit: contain;
      border-radius: 5px;
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    #no-slide-msg {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
    }

    /* Drag ghost */
    .slide-thumb.dragging { opacity: 0.4; }

    /* Responsive */
    @media (max-width: 900px) {
      :root {
        --sidebar-w: 150px;
        --panel-w: 200px;
      }
      .thumb-inner { width: 130px; height: 73px; }
      .thumb-frame { width: 1920px; height: 1080px; transform: scale(0.0677); }
    }
    @media (max-width: 650px) {
      #panel { display: none; }
      :root { --sidebar-w: 120px; }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <h1>&#9654; Slide Editor</h1>
  <button class="btn btn-ghost" id="import-btn">&#8599; Import HTML</button>
  <button class="btn btn-accent" id="export-btn">&#8600; Export HTML</button>
  <input type="file" id="import-file" accept=".html,.htm" style="display:none">
</div>

<!-- LAYOUT -->
<div id="layout">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-header">
      <span>Slides</span>
      <button id="add-slide-btn" title="Add slide">+</button>
    </div>
    <div id="slides-list"></div>
  </div>

  <!-- MAIN PREVIEW -->
  <div id="main">
    <div id="slide-counter"></div>
    <div id="preview-wrapper">
      <iframe id="preview-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
    <div id="no-slide-msg" style="display:none">No slides yet. Click + to add one.</div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="panel">
    <div class="panel-section">
      <h3>Slide Background</h3>
      <div class="control-row">
        <label>Color</label>
        <input type="color" id="bg-color" value="#ffffff">
      </div>
    </div>

    <div class="panel-section">
      <h3>Text</h3>
      <div id="selected-info">No element selected</div>
      <div class="control-row">
        <label>Color</label>
        <input type="color" id="text-color" value="#000000">
      </div>
      <div class="control-row">
        <label>Size (px)</label>
        <div class="number-input">
          <button id="font-dec">&#8722;</button>
          <input type="number" id="font-size" value="24" min="8" max="200">
          <button id="font-inc">+</button>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <h3>Image</h3>
      <div class="img-upload-area" id="img-upload-area">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="m21 15-5-5L5 21"/>
        </svg>
        <span>Click to add image</span>
      </div>
      <div id="img-preview-panel">
        <img id="img-preview-thumb" alt="Selected image">
        <button class="btn btn-ghost" id="replace-img-btn" style="font-size:12px;padding:5px 10px;">Replace</button>
        <button class="btn btn-danger" id="delete-img-btn" style="font-size:12px;padding:5px 10px;">Delete image</button>
      </div>
      <input type="file" id="img-file" accept="image/*" style="display:none">
    </div>
  </div>

</div>

<script>
(function() {
  'use strict';

  // STATE
  var slides = [];
  var currentIndex = -1;

  var SLIDE_W = 1920;
  var SLIDE_H = 1080;

  // DOM REFS
  var slidesList     = document.getElementById('slides-list');
  var addSlideBtn    = document.getElementById('add-slide-btn');
  var importBtn      = document.getElementById('import-btn');
  var exportBtn      = document.getElementById('export-btn');
  var importFile     = document.getElementById('import-file');
  var previewIframe  = document.getElementById('preview-iframe');
  var previewWrapper = document.getElementById('preview-wrapper');
  var slideCounter   = document.getElementById('slide-counter');
  var noSlideMsg     = document.getElementById('no-slide-msg');
  var bgColorInput   = document.getElementById('bg-color');
  var textColorInput = document.getElementById('text-color');
  var fontSizeInput  = document.getElementById('font-size');
  var fontDecBtn     = document.getElementById('font-dec');
  var fontIncBtn     = document.getElementById('font-inc');
  var selectedInfo   = document.getElementById('selected-info');
  var imgUploadArea  = document.getElementById('img-upload-area');
  var imgFile        = document.getElementById('img-file');
  var imgPreviewPanel= document.getElementById('img-preview-panel');
  var imgPreviewThumb= document.getElementById('img-preview-thumb');
  var replaceImgBtn  = document.getElementById('replace-img-btn');
  var deleteImgBtn   = document.getElementById('delete-img-btn');

  var currentScale = 1;

  // RESIZE PREVIEW
  function resizePreview() {
    var main = document.getElementById('main');
    var availW = main.clientWidth - 48;
    var availH = main.clientHeight - 80;
    currentScale = Math.min(availW / SLIDE_W, availH / SLIDE_H);
    var w = Math.round(SLIDE_W * currentScale);
    var h = Math.round(SLIDE_H * currentScale);
    previewIframe.style.width  = SLIDE_W + 'px';
    previewIframe.style.height = SLIDE_H + 'px';
    previewIframe.style.transform = 'scale(' + currentScale + ')';
    previewIframe.style.transformOrigin = 'top left';
    previewWrapper.style.width  = w + 'px';
    previewWrapper.style.height = h + 'px';
  }
  window.addEventListener('resize', resizePreview);
  resizePreview();

  // DEFAULT SLIDE HTML
  function defaultSlideHTML() {
    return '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:20px;padding:60px;">\n' +
      '  <h1 style="font-size:48px;font-weight:700;color:#222;text-align:center;font-family:sans-serif;">Click to edit title</h1>\n' +
      '  <p style="font-size:24px;color:#555;text-align:center;font-family:sans-serif;">Click to edit subtitle text</p>\n' +
      '</div>';
  }

  // ADD SLIDE
  function addSlide(html, bg) {
    slides.push({ html: html || defaultSlideHTML(), bg: bg || '#ffffff' });
    renderSidebar();
    selectSlide(slides.length - 1);
  }

  addSlideBtn.addEventListener('click', function() { addSlide(); });

  // SELECT SLIDE
  function selectSlide(idx) {
    if (idx < 0 || idx >= slides.length) return;
    if (currentIndex >= 0 && currentIndex < slides.length) {
      syncFromIframe();
    }
    currentIndex = idx;
    updateSelectedInfo(null);
    updateImgPanel(null);
    renderPreview();
    renderSidebar();
    bgColorInput.value = slides[currentIndex].bg || '#ffffff';
    slideCounter.textContent = 'Slide ' + (idx + 1) + ' of ' + slides.length;
    noSlideMsg.style.display = 'none';
    previewWrapper.style.display = '';
    slideCounter.style.display = '';
  }

  // SYNC HTML FROM IFRAME — strips editing decorations, call on slide switch/export only
  function syncFromIframe() {
    if (currentIndex < 0) return;
    try {
      var iDoc = previewIframe.contentDocument;
      if (!iDoc) return;
      iDoc.querySelectorAll('[contenteditable]').forEach(function(el) {
        el.removeAttribute('contenteditable');
        el.style.outline = '';
        el.style.cursor = '';
      });
      iDoc.querySelectorAll('img').forEach(function(im) { im.style.outline = ''; });
      slides[currentIndex].html = iDoc.body.innerHTML;
    } catch(e) {}
  }

  // SAVE CONTENT — non-destructive save (clone body, strip decorations, store)
  function saveContent(pushHistory) {
    if (currentIndex < 0) return;
    try {
      var iDoc = previewIframe.contentDocument;
      if (!iDoc) return;
      var clone = iDoc.body.cloneNode(true);
      clone.querySelectorAll('[contenteditable]').forEach(function(el) {
        el.removeAttribute('contenteditable');
        el.style.outline = '';
        el.style.cursor = '';
      });
      clone.querySelectorAll('img').forEach(function(im) { im.style.outline = ''; });
      var html = clone.innerHTML;
      if (pushHistory && slides[currentIndex].html !== html) {
        pushUndo();
      }
      slides[currentIndex].html = html;
    } catch(e) {}
  }

  // UNDO
  var undoStack = [];
  function pushUndo() {
    undoStack.push(slides.map(function(s) {
      return { html: s.html, bg: s.bg, bodyStyle: s.bodyStyle, headExtra: s.headExtra };
    }));
    if (undoStack.length > 50) undoStack.shift();
  }
  function undo() {
    if (undoStack.length === 0) return;
    slides = undoStack.pop();
    renderSidebar();
    renderPreview();
    refreshThumb(currentIndex);
  }
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  });

  // Inject current scale into iframe so drag deltas are correct
  function injectScaleToIframe() {
    try {
      previewIframe.contentWindow.__editorScale = currentScale;
    } catch(e) {}
  }
  previewIframe.addEventListener('load', injectScaleToIframe);

  // RENDER PREVIEW
  function renderPreview() {
    if (currentIndex < 0 || currentIndex >= slides.length) return;
    var slide = slides[currentIndex];
    previewIframe.removeAttribute('src');
    previewIframe.srcdoc = buildSlideDoc(slide.html || '', slide.bg || '#ffffff', true, slide.bodyStyle || '', slide.headExtra || '');
  }

  function buildSlideDoc(html, bg, interactive, bodyStyle, headExtra) {
    var interactiveScript = '';
    if (interactive) {
      interactiveScript = '<scr' + 'ipt>' +
        '(function(){' +
        'var sel=null,editing=false,dragActive=false,dragOX=0,dragOY=0,dragging=false,freshSel=false;' +
        'var dragTX=0,dragTY=0;' + // accumulated translate offset for current drag
        'var resizeEl=null,resizeHandle=null,resizeStartX=0,resizeStartY=0,resizeStartRect={};' +
        'var overlay=null;' +

        'function getScale(){return window.__editorScale||1;}' +
        'function rgbToHex(rgb){var m=rgb.match(/rgb\\\\((\\\\d+),\\\\s*(\\\\d+),\\\\s*(\\\\d+)\\\\)/);if(!m)return"#000000";return"#"+[m[1],m[2],m[3]].map(function(x){return parseInt(x).toString(16).padStart(2,"0");}).join("");}' +
        'function getComputedFS(el){return parseInt(window.getComputedStyle(el).fontSize)||16;}' +

        // Walk up past inline tags to nearest block element
        'function findBlock(t){' +
          'if(!t||t===document.body||t===document.documentElement)return null;' +
          'var inline=["SPAN","A","STRONG","EM","B","I","U","SMALL","SUP","SUB","CODE","ABBR","CITE","S","MARK","TIME","BR","WBR"];' +
          'var el=t;' +
          'while(el&&el!==document.body&&inline.indexOf(el.tagName)>-1)el=el.parentNode;' +
          'return(el&&el!==document.body&&el!==document.documentElement)?el:null;' +
        '}' +

        // Get current translate values from element style
        'function getTranslate(el){' +
          'var m=(el.style.transform||"").match(/translate\\(([^,]+)px,([^)]+)px\\)/);' +
          'return m?{x:parseFloat(m[1]),y:parseFloat(m[2])}:{x:0,y:0};' +
        '}' +
        // Move element using CSS transform (never disturbs document flow)
        'function applyTranslate(el,tx,ty){' +
          'var base=(el.style.transform||"").replace(/translate\\([^)]*\\)/g,"").trim();' +
          'el.style.transform="translate("+tx+"px,"+ty+"px)"+(base?" "+base:"");' +
        '}' +

        // Lock element absolutely in place (used only for resize)
        'function makeAbsolute(el){' +
          'if(el.style.position==="absolute")return;' +
          'var r=el.getBoundingClientRect(),br=document.body.getBoundingClientRect();' +
          // absorb any translate offset into left/top so we start clean
          'el.style.transform=(el.style.transform||"").replace(/translate\\([^)]*\\)/g,"").trim();' +
          'el.style.position="absolute";' +
          'el.style.left=(r.left-br.left)+"px";el.style.top=(r.top-br.top)+"px";' +
          'el.style.width=r.width+"px";el.style.height=r.height+"px";' +
          'el.style.margin="0";el.style.flexShrink="0";' +
        '}' +
        // Freeze every sibling in el's parent at their current positions (prevents flex reflow during resize)
        'function freezeContainer(el){' +
          'var p=el.parentNode;if(!p)return;' +
          'Array.prototype.forEach.call(p.children,function(c){if(c!==overlay)makeAbsolute(c);});' +
        '}' +

        // Overlay: the orange border IS the drag handle
        'function createOverlay(){' +
          'removeOverlay();' +
          'overlay=document.createElement("div");' +
          'overlay.style.cssText="position:fixed;box-sizing:border-box;border:2px solid #FF6B35;z-index:2147483646;cursor:move;";' +
          'positionOverlay();' +
          'overlay.addEventListener("mousedown",function(e){' +
            'if(e.target!==overlay)return;' +
            'e.stopPropagation();e.preventDefault();' +
            'var t=getTranslate(sel);dragTX=t.x;dragTY=t.y;' +
            'dragActive=true;dragOX=e.clientX;dragOY=e.clientY;dragging=false;' +
          '});' +
          '["nw","n","ne","e","se","s","sw","w"].forEach(function(h){' +
            'var hd=document.createElement("div");hd.dataset.handle=h;' +
            'var pos={nw:"top:-5px;left:-5px",n:"top:-5px;left:calc(50% - 5px)",ne:"top:-5px;right:-5px",' +
                    'e:"top:calc(50% - 5px);right:-5px",se:"bottom:-5px;right:-5px",' +
                    's:"bottom:-5px;left:calc(50% - 5px)",sw:"bottom:-5px;left:-5px",w:"top:calc(50% - 5px);left:-5px"};' +
            'var cur={nw:"nw-resize",n:"n-resize",ne:"ne-resize",e:"e-resize",se:"se-resize",s:"s-resize",sw:"sw-resize",w:"w-resize"};' +
            'hd.style.cssText="position:absolute;width:10px;height:10px;background:#FF6B35;border:1px solid #fff;box-sizing:border-box;z-index:2147483647;border-radius:2px;"+pos[h]+";cursor:"+cur[h]+";";' +
            'hd.addEventListener("mousedown",onResizeStart);overlay.appendChild(hd);' +
          '});' +
          'document.body.appendChild(overlay);' +
        '}' +
        'function positionOverlay(){' +
          'if(!overlay||!sel)return;' +
          'var r=sel.getBoundingClientRect();' +
          'overlay.style.left=(r.left-2)+"px";overlay.style.top=(r.top-2)+"px";' +
          'overlay.style.width=(r.width+4)+"px";overlay.style.height=(r.height+4)+"px";' +
        '}' +

  // IFRAME MESSAGES
  window.addEventListener('message', function(e) {
    if (!e.data || !e.data.type) return;
    var msg = e.data;
    if (msg.type === 'select-text') {
      updateImgPanel(null);
      updateSelectedInfo(msg.tag ? msg.tag.toLowerCase() : null);
      fontSizeInput.value = msg.fontSize || 16;
      if (msg.color) textColorInput.value = msg.color;
    } else if (msg.type === 'select-img') {
      updateSelectedInfo(null);
      updateImgPanel(msg.src);
    } else if (msg.type === 'deselect') {
      updateSelectedInfo(null);
      updateImgPanel(null);
    } else if (msg.type === 'drag-end') {
      saveContent(true); // push undo on drag complete
      refreshThumb(currentIndex);
    } else if (msg.type === 'text-input') {
      saveContent(false);
      refreshThumb(currentIndex);
    } else if (msg.type === 'text-commit') {
      saveContent(true);
      refreshThumb(currentIndex);
    } else if (msg.type === 'undo-request') {
      undo();
    }
  });

  function getSelectedElFromIframe() {
    try {
      return previewIframe.contentDocument.querySelector('[contenteditable="true"]');
    } catch(e) { return null; }
  }

  function getSelectedImgFromIframe() {
    try {
      var imgs = previewIframe.contentDocument.querySelectorAll('img');
      for (var i = 0; i < imgs.length; i++) {
        if (imgs[i].style.outline && imgs[i].style.outline.indexOf('#FF6B35') > -1) return imgs[i];
      }
      return null;
    } catch(e) { return null; }
  }

  function updateSelectedInfo(tag) {
    if (tag) {
      selectedInfo.textContent = '<' + tag + '> selected';
    } else {
      selectedInfo.textContent = 'No element selected';
    }
  }

  function updateImgPanel(src) {
    if (src) {
      imgPreviewThumb.src = src;
      imgPreviewPanel.classList.add('visible');
    } else {
      imgPreviewPanel.classList.remove('visible');
      imgPreviewThumb.src = '';
    }
  }

  // BG COLOR
  bgColorInput.addEventListener('input', function() {
    if (currentIndex < 0) return;
    slides[currentIndex].bg = bgColorInput.value;
    try {
      previewIframe.contentDocument.documentElement.style.background = bgColorInput.value;
      previewIframe.contentDocument.body.style.background = bgColorInput.value;
    } catch(e) {}

  });

  // TEXT COLOR
  textColorInput.addEventListener('input', function() {
    var el = getSelectedElFromIframe();

  // FONT SIZE
  function applyFontSize(size) {
    var el = getSelectedElFromIframe();
    if (!el) return;
    el.style.fontSize = size + 'px';
    fontSizeInput.value = size;
    syncFromIframe();
    refreshThumb(currentIndex);

  fontSizeInput.addEventListener('change', function() {

  fontDecBtn.addEventListener('click', function() {
    applyFontSize(Math.max(8, (parseInt(fontSizeInput.value) || 16) - 2));

  fontIncBtn.addEventListener('click', function() {

  // IMAGE UPLOAD
  imgUploadArea.addEventListener('click', function() {
    imgFile.value = '';
    imgFile.click();

  replaceImgBtn.addEventListener('click', function() {
    imgFile.value = '';
    imgFile.click();

  imgFile.addEventListener('change', function() {
    var file = imgFile.files[0];

    var reader = new FileReader();
    reader.onload = function(e) { insertOrReplaceImage(e.target.result); };
    reader.readAsDataURL(file);

  function insertOrReplaceImage(dataUrl) {
    if (currentIndex < 0) return;
    try {
      var iDoc = previewIframe.contentDocument;
      var existingSelected = getSelectedImgFromIframe();
      if (existingSelected) {
        existingSelected.src = dataUrl;
        existingSelected.style.outline = '2px solid #FF6B35';
        imgPreviewThumb.src = dataUrl;
        imgPreviewPanel.classList.add('visible');
      } else {
        var img = iDoc.createElement('img');
        img.src = dataUrl;
        img.style.cssText = 'max-width:80%;max-height:400px;display:block;margin:20px auto;border-radius:4px;';
        iDoc.querySelectorAll('img').forEach(function(im){ im.style.outline=''; });
        img.style.outline = '2px solid #FF6B35';
        iDoc.body.appendChild(img);
        updateImgPanel(dataUrl);
      }
      syncFromIframe();
      refreshThumb(currentIndex);
    } catch(ex) { console.error('Image insert error', ex); }
  }

  deleteImgBtn.addEventListener('click', function() {
    var img = getSelectedImgFromIframe();
    if (img) {
      img.parentNode.removeChild(img);
      updateImgPanel(null);
      syncFromIframe();
      refreshThumb(currentIndex);
    }
  });

  // SIDEBAR RENDERING
  function renderSidebar() {
    slidesList.innerHTML = '';
    for (var idx = 0; idx < slides.length; idx++) {
      (function(i) {
        var slide = slides[i];
        var thumb = document.createElement('div');
        thumb.className = 'slide-thumb' + (i === currentIndex ? ' active' : '');
        thumb.dataset.idx = i;
        thumb.draggable = true;

        var inner = document.createElement('div');
        inner.className = 'thumb-inner';

        var frame = document.createElement('div');
        frame.className = 'thumb-frame';
        frame.style.cssText = (slide.bodyStyle || '') + ';width:' + SLIDE_W + 'px;height:' + SLIDE_H + 'px;transform-origin:top left;transform:scale(0.0896);overflow:hidden;';
        frame.innerHTML = slide.html || '';

        inner.appendChild(frame);

        var idxLabel = document.createElement('div');
        idxLabel.className = 'thumb-index';
        idxLabel.textContent = i + 1;

        var delBtn = document.createElement('button');
        delBtn.className = 'thumb-delete';
        delBtn.innerHTML = '&times;';
        delBtn.title = 'Delete slide';
        delBtn.addEventListener('click', function(e) { e.stopPropagation(); deleteSlide(i); });

        thumb.appendChild(inner);
        thumb.appendChild(idxLabel);
        thumb.appendChild(delBtn);

        thumb.addEventListener('click', function() { selectSlide(i); });
        thumb.addEventListener('dragstart', onDragStart);
        thumb.addEventListener('dragover',  onDragOver);
        thumb.addEventListener('dragleave', onDragLeave);
        thumb.addEventListener('drop',      onDrop);
        thumb.addEventListener('dragend',   onDragEnd);

        slidesList.appendChild(thumb);
      })(idx);
    }

    if (slides.length === 0) {
      noSlideMsg.style.display = 'block';
      previewWrapper.style.display = 'none';
      slideCounter.style.display = 'none';
    }
  }

  function refreshThumb(idx) {
    if (idx < 0 || idx >= slides.length) return;
    var thumbs = slidesList.querySelectorAll('.slide-thumb');
    if (!thumbs[idx]) return;
    var frame = thumbs[idx].querySelector('.thumb-frame');
    if (frame) {
      frame.innerHTML = slides[idx].html || '';
      frame.style.cssText = (slides[idx].bodyStyle || '') + ';width:' + SLIDE_W + 'px;height:' + SLIDE_H + 'px;transform-origin:top left;transform:scale(0.0896);overflow:hidden;';
    }
  }

  // DELETE SLIDE
  function deleteSlide(idx) {
    slides.splice(idx, 1);
    if (slides.length === 0) {
      currentIndex = -1;
      renderSidebar();
      noSlideMsg.style.display = 'block';
      previewWrapper.style.display = 'none';
      slideCounter.style.display = 'none';
      return;
    }
    if (currentIndex >= slides.length) currentIndex = slides.length - 1;
    else if (currentIndex > idx) currentIndex--;
    renderSidebar();
    selectSlide(currentIndex);
  }

  // DRAG & DROP
  var dragSrcIdx = -1;

  function onDragStart(e) {
    dragSrcIdx = parseInt(this.dataset.idx);
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragSrcIdx);
  }
  function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    var thumbs = document.querySelectorAll('.slide-thumb');
    for (var i = 0; i < thumbs.length; i++) thumbs[i].classList.remove('drag-over');
    this.classList.add('drag-over');
  }
  function onDragLeave() {
    this.classList.remove('drag-over');
  }
  function onDrop(e) {
    e.preventDefault();
    var targetIdx = parseInt(this.dataset.idx);
    if (dragSrcIdx === targetIdx) return;
    var moved = slides.splice(dragSrcIdx, 1)[0];
    slides.splice(targetIdx, 0, moved);
    if (currentIndex === dragSrcIdx) {
      currentIndex = targetIdx;
    } else if (dragSrcIdx < currentIndex && targetIdx >= currentIndex) {
      currentIndex--;
    } else if (dragSrcIdx > currentIndex && targetIdx <= currentIndex) {
      currentIndex++;
    }
    renderSidebar();
    selectSlide(currentIndex);
  }
  function onDragEnd() {
    var thumbs = document.querySelectorAll('.slide-thumb');
    for (var i = 0; i < thumbs.length; i++) {
      thumbs[i].classList.remove('dragging');
      thumbs[i].classList.remove('drag-over');
    }
  }

  importBtn.addEventListener('click', function() {

  importFile.addEventListener('change', function() {
    var file = importFile.files[0];

    var reader = new FileReader();
    reader.onload = function(e) { parseImportedHTML(e.target.result); };
    reader.readAsText(file);
  });

  function parseImportedHTML(html) {
    var newSlides = [];

    // Handle slides-grab bundled format
    var bundleMatch = html.match(/<script[^>]+type="__bundler\/template"[^>]*>([\s\S]*?)<\/script>/);
    if (bundleMatch) {
      try {
        var inner = JSON.parse(bundleMatch[1].trim());

        // Build full resource map (images + fonts) from manifest
        var manifestMatch = html.match(/<script[^>]+type="__bundler\/manifest"[^>]*>([\s\S]*?)<\/script>/);
        if (manifestMatch) {
          try {
            var manifest = JSON.parse(manifestMatch[1].trim());
            Object.keys(manifest).forEach(function(uuid) {
              var entry = manifest[uuid];
              if (entry.mime && entry.data) {
                var dataUri = 'data:' + entry.mime + ';base64,' + entry.data;
                // Replace all occurrences of this UUID in the template
                inner = inner.split('"' + uuid + '"').join('"' + dataUri + '"');
                inner = inner.split("'" + uuid + "'").join("'" + dataUri + "'");
              }
            });
          } catch(e2) {}
        }

        // Extract helmet (fonts, global styles)
        var helmetStyles = '';
        var helmetMatch = inner.match(/<helmet>([\s\S]*?)<\/helmet>/);
        if (helmetMatch) helmetStyles = helmetMatch[1];

        // Parse and extract sections
        var parser2 = new DOMParser();
        var innerDoc = parser2.parseFromString(inner, 'text/html');
        var bundleSections = Array.from(innerDoc.querySelectorAll('section'));
        if (bundleSections.length > 0) {
          bundleSections.forEach(function(sec) {
            var bg = sec.style.backgroundColor || sec.style.background || '#ffffff';
            var secStyle = sec.getAttribute('style') || '';
            newSlides.push({
              html: sec.innerHTML,
              bg: extractColor(bg) || '#ffffff',
              bodyStyle: secStyle,
              headExtra: helmetStyles
            });
          });
        }
      } catch(e) { console.error('Bundle parse error', e); }
    }

    // Standard HTML formats
    if (newSlides.length === 0) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');
      var sections = Array.from(doc.querySelectorAll('section'));
      if (sections.length === 0) sections = Array.from(doc.querySelectorAll('div.slide'));
      if (sections.length > 0) {
        sections.forEach(function(sec) {
          var bg = sec.style.backgroundColor || sec.style.background || '#ffffff';
          var secStyle = sec.getAttribute('style') || '';
          newSlides.push({ html: sec.innerHTML, bg: extractColor(bg) || '#ffffff', bodyStyle: secStyle, headExtra: '' });
        });
      } else {
        newSlides.push({ html: doc.body ? doc.body.innerHTML : html, bg: '#ffffff', bodyStyle: '', headExtra: '' });
      }
    }

    if (newSlides.length > 0) {
      slides = newSlides;
      currentIndex = -1;
      renderSidebar();
      selectSlide(0);
    }
  }

  function extractColor(colorStr) {
    if (!colorStr) return '#ffffff';
    colorStr = colorStr.trim();
    if (colorStr.startsWith('#')) return colorStr;
    var m = colorStr.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
    if (m) {
      return '#' + [m[1],m[2],m[3]].map(function(x){ return parseInt(x).toString(16).padStart(2,'0'); }).join('');
    }
    return '#ffffff';
  }

'    function prevSlide() { showSlide(current - 1); }\n' +

'    document.addEventListener("keydown", function(e) {\n' +
'      if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") { e.preventDefault(); nextSlide(); }\n' +
'      else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); prevSlide(); }\n' +
'    });\n' +
'    function toggleFullscreen() {\n' +
'      if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(function(){}); }\n' +
'      else { document.exitFullscreen(); }\n' +
'    }\n' +
'    resize();\n' +
'    showSlide(0);\n' +
'  <\/script>\n' +
'</body>\n' +
'</html>';
  }

  function downloadFile(name, content) {
    var blob = new Blob([content], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
  }

  // INIT - create two starter slides
